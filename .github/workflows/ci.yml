name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Check Formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go files are not formatted properly. Run 'go fmt ./...'"
          gofmt -l .
          exit 1
        fi

    - name: Run Go Vet
      run: go vet ./...

    - name: Run Tests with Coverage
      run: go test -v -coverprofile=coverage.out ./...
